<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hostinger-product-card</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Desarrollar y estilar el product card de hostinger</h1>   

    <div class="tarjeta-contenedor">
        <!-- 1er RENGLON -->
        <div class="descuento-79-off">
            <span>79% off</span>
        </div>

        <!-- 2do RENGLON -->
        <div class="info-plan">
            <h2>Single</h2>  
            <p>Subi tu primera página web a internet.
                Ideal para principiantes o proyectos
                simples.
            </p>
        </div>

        <!-- 3er RENGLON -->
        <div class="seccion-precios">
            <!-- Precio original (chico y tachado) -->
            <span class="precio-original">$12.089</span>
            
            <!-- Precio actual (grande) y su periodo (/mes) -->
            <div class="precio-actual">
                <span class="monto">ARS $2.499</span>
                <span class="periodo">/mes</span>
            </div>
        </div>

        <!-- 4er RENGLON -->
        <div class="seccion-precios">
            <!-- Precio original (chico y tachado) -->
            <a class="elegir-plan" href="./plan.html">Elegir plan</a>
        </div>

        <!-- 2do RENGLON -->
        <div class="info-plan">
            <p>Obtene 48 meses por <span class="precio-promocion">Ars $119.992</span>.
                precio regular: (ARS $580.752).Se renueva a ARS 9.699/mes.
            </p>
        </div>


    </div>
    
</body>
</html>
