<body>
    <!--Cada elemente tiene un display por defecto
    Display
        inline:
            Solo opupa el ancho del contenido        
            NO puede cambiar sus dimensiones ((with, height)
            ejemplo:span
        block:
            opupa todo el ancho del contenido
            Si puede cambiar sus dimensiones ((with, height)
            ejemplo:div
        inline-block:
            Solo opupa el ancho del contenido        
            puede cambiar  sus dimensiones ((with, height)
            ejemplo:button

    -->
</body>
