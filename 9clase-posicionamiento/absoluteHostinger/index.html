<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Normalizamos nuestra pagína -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostinger: dale vida a tu idea en internet con una web</title>
    
    <!-- Favicon copiado de la misma pagina -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <div class="div_contenedor">
            <!-- logo icono -->
            <div class="h-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8.61904 8.18478V15.8156L4.25854 20.1761V14.7255L6.98358 12.0005L4.25854 9.27491V3.82429L8.61904 8.18478Z" fill="currentColor"></path>
                <path d="M16.4017 12.6814L9.79337 16.4966L8.19694 22.4529L12.9175 19.7279L13.9153 16.0051L17.6381 17.0023L22.3581 14.2773L16.4017 12.6814Z" fill="currentColor"></path>
                <path d="M16.4017 11.3225L9.79337 7.50682L8.19694 1.55045L12.9175 4.27548L13.9153 7.99828L17.6381 7.00106L22.3581 9.7261L16.4017 11.3225Z" fill="currentColor"></path>
                </svg>
            </div>

            <!-- h2 con texto -->
            <h2><span class="expresa_tu_idea">Expresá tu idea.</span></h2>

            <div class="agente-container">
                <span class="agente">El Agente Hostinger se encarga del resto.</span>
            </div>

            <div class="input-contenedor">
                <label for="eleccion-usuario" class="visually-hidden">¿Qué te gustaría crear hoy?</label>
                <input type="text" id="eleccion-usuario"
                placeholder="¿Qué te gustaría crear hoy?"
                required
                >

                <button type="button" class="btn-enviar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9.04289 6.04289C9.43342 5.65237 10.0666 5.65237 10.4571 6.04289L15.7071 11.2929C16.0976 11.6834 16.0976 12.3166 15.7071 12.7071L10.4571 17.9571C10.0666 18.3476 9.43342 18.3476 9.04289 17.9571C8.65237 17.5666 8.65237 16.9334 9.04289 16.5429L13.5858 12L9.04289 7.45711C8.65237 7.06658 8.65237 6.43342 9.04289 6.04289Z" fill="currentColor"></path>
                    </svg>
                </button>
            </div>

            <div class="plan">
                <span>Obtenga un plan de sitio e ideas en menos de un minuto. Gratis, sin registro.</span>
            </div>
        </div>
    </main>
    
</body>
</html>
